        private void button3_Click(object sender, EventArgs e)
        {
            // 모든 실린더 후진 상태로 초기화
            Writedata[0] &= 0xFE; // 1번 실린더 OFF (bit 0)
            Writedata[0] &= 0xFD; // 2번 실린더 전진 OFF (bit 1)
            Writedata[0] |= 0x04; // 2번 실린더 후진 ON (bit 2)

            CIFX.xChannelWrite(Writedata);
        }

        private void button1_Click(object sender, EventArgs e)
        {
            autoStep = 0;
            timer2.Interval = 300; // 1초 간격
            timer2.Start();
        }

        private void button2_Click(object sender, EventArgs e)
        {
            // 자동 시퀀스 타이머 정지
            timer2.Stop();

            // 모든 실린더 동작 중지 (비트 OFF)
            Writedata[0] &= 0xF8; // Bit 0~2 OFF (0000 0111 -> 반전 = 1111 1000)
            CIFX.xChannelWrite(Writedata);

            MessageBox.Show("자동운전이 중지되었습니다.", "중지");
        }

        private void timer2_Tick(object sender, EventArgs e)
        {
            switch (autoStep)
            {
                case 0:
                    // 2번 실린더 전진
                    Writedata[0] |= 0x02;
                    Writedata[0] &= 0xFB;
                    CIFX.xChannelWrite(Writedata);
                    break;
                case 1:
                    // 2번 실린더 후진
                    Writedata[0] |= 0x04;
                    Writedata[0] &= 0xFD;
                    CIFX.xChannelWrite(Writedata);
                    break;
                case 2:
                    // 1번 실린더 전진
                    Writedata[0] |= 0x01;
                    CIFX.xChannelWrite(Writedata);
                    break;
                case 3:
                    // 1번 실린더 후진
                    Writedata[0] &= 0xFE;
                    CIFX.xChannelWrite(Writedata);
                    break;
            }

            autoStep = (autoStep + 1) % 4; // 0 → 1 → 2 → 3 → 0 → ...
        }
    }
